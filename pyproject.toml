[project]
name = "yaci-client"
version = "1.0.0"
description = "A client library for accessing the Yaci Store API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hareem Adderley", email = "hadderley@kingpinapps.com" }]
requires-python = ">=3.11"
keywords = ["cardano", "yaci", "yaci-store", "yaci-devkit", "openapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    # 22.2 adds the `alias` argument the generated client passes to attrs.field().
    "attrs>=22.2.0",
    # 0.25.1 is the first release on httpcore 1.x without `import cgi`: older ones fail on Python 3.13+.
    "httpx>=0.25.1,<0.29.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/Kingpin-Apps/Yaci-client"
Source = "https://github.com/Kingpin-Apps/Yaci-client"
Issues = "https://github.com/Kingpin-Apps/Yaci-client/issues"
Changelog = "https://github.com/Kingpin-Apps/Yaci-client/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "commitizen>=4.8",
    "pre-commit>=4.3",
]
lint = [
    "ruff>=0.17",
    "ty>=0.0.90",
]
test = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7",
]
generate = [
    # 0.28 drops the `Unset` import from submit_tx_1, so stay on 0.27 until that is fixed upstream.
    "openapi-python-client>=0.27.1,<0.28",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
# The package sits at the repository root rather than under src/.
module-root = ""

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
# Every warning fails the test that raised it: deprecations are caught early.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["yaci_client"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120
# example.py talks to a running DevKit and has local edits pending; lint it once they land.
extend-exclude = ["dist", "example.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
# E501: generated docstrings carry long descriptions from the OpenAPI spec.
# UP042, SIM108: the generator's own style for enums and response parsing.
ignore = ["E501", "UP042", "SIM108"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["yaci_client", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = false
version_files = ["yaci_client/__init__.py:__version__"]
